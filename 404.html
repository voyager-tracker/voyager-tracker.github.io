<!DOCTYPE html>
<html lang="en" data-site-root="/">
<head>
<script>window.SITE_LANG = 'en';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Lost | Voyager Tracker</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/images/icons/favicon.svg">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
<canvas id="starfield" aria-hidden="true"></canvas>
<div class="notfound-wrap">
  <div class="notfound-code">404</div>
  <h1 data-i18n="notfound.title">SIGNAL LOST</h1>
  <p data-i18n="notfound.body">The requested destination could not be found.</p>
  <a class="btn-primary" href="/" data-i18n="notfound.cta">RETURN TO MISSION CONTROL</a>
  <div class="lang-toggle" role="group" aria-label="Language" style="margin-top:20px;">
    <button class="lang-toggle-btn" data-lang="en" type="button">EN</button>
    <button class="lang-toggle-btn" data-lang="zh" type="button">繁中</button>
    <button class="lang-toggle-btn" data-lang="es" type="button">ES</button>
    <button class="lang-toggle-btn" data-lang="ja" type="button">日本語</button>
  </div>
</div>
<script src="/js/i18n.js"></script>
<script>
(function () {
  var canvas = document.getElementById('starfield');
  var ctx = canvas.getContext('2d');
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize); resize();
  ctx.fillStyle = '#030509'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (var i = 0; i < 200; i++) {
    ctx.fillStyle = 'rgba(200,220,255,' + (0.3 + Math.random() * 0.6) + ')';
    ctx.beginPath();
    ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 1.3, 0, Math.PI * 2);
    ctx.fill();
  }
})();
</script>
</body>
</html>
